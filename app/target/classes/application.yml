server:
  port: 8080

spring:
  application:
    name: spring-plsql-app
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:sys as sysdba}
    password: ${SPRING_DATASOURCE_PASSWORD:OraclePassword123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000



logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.jdbc.core.simple.SimpleJdbcCall: DEBUG

