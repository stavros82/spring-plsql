version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=OraclePassword123
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: spring-plsql-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      - SPRING_DATASOURCE_USERNAME=sys as sysdba
      - SPRING_DATASOURCE_PASSWORD=OraclePassword123
      - SPRING_LIQUIBASE_ENABLED=true
    depends_on:
      oracle-db:
        condition: service_healthy